plugins { id 'java' }

group = 'com.mydrops'
version = '0.1.0'
repositories {
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}
dependencies {
    compileOnly 'net.runelite:client:1.13.3'
    testImplementation 'net.runelite:client:1.13.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:3.12.4'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}
test { systemProperty 'java.awt.headless', 'true' }
// Also applies to the JavaExec task IntelliJ generates when running main().
tasks.withType(JavaExec).configureEach { enableAssertions = true }
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('com.mydrops.MyDropsLauncher')
}
tasks.register('renderPreview', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('com.mydrops.AppearancePreview')
    systemProperty 'java.awt.headless', 'true'
    args layout.buildDirectory.dir('previews').get().asFile.absolutePath
}
jar { from('LICENSE', 'runelite-plugin.properties') }
